jdbc:
  derby1:
    jdbcUrl: "jdbc:derby:target/derby/1;create=true"
  derby2:
    jdbcUrl: "jdbc:derby:target/derby/2;create=true"
  # this emulates a bad DB
  derby3:
    jdbcUrl: "jdbc:derby:target/derby/3;create=false"
    initializationFailTimeout: -1

  # with the full BOM on the classpath, an auto-loaded Cayenne must be pointed at a DataSource. Giving it
  # its own, so that the health checks of derby1..derby3 stay under this test's control
  derbyCayenne:
    jdbcUrl: "jdbc:derby:target/derby/cayenne;create=true"

cayenne:
  datasource: derbyCayenne
